<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trinity Atlas</title><style>body{margin:0;background:#0c1525;color:#edf3ff;font:16px system-ui}header,main{padding:18px;max-width:1100px;margin:auto}header{border-bottom:1px solid #456}h1{margin:0 0 12px}button,input,select{font:inherit;border:1px solid #52729b;border-radius:8px;padding:10px;background:#1d3453;color:white}button{cursor:pointer}button:hover,.active{background:#356d9d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input{flex:1;min-width:170px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:12px}.panel{background:#17263c;border:1px solid #34506b;border-radius:12px;padding:12px;min-width:0}#map{height:460px;width:100%;touch-action:none;background:#0c1c30;border-radius:8px}.hidden{display:none}.entry{padding:12px;border-bottom:1px solid #456;cursor:pointer}.entry:hover{background:#2c4969}.muted{color:#aec0d6}#detail button,#argumentDetail button{display:block;margin:6px 0;text-align:left}a{color:#9dd7ff}@media(max-width:700px){.layout{grid-template-columns:1fr}#map{height:350px}}</style></head><body><header><h1>Trinity Atlas</h1><div class="toolbar"><button data-tab="network" class="active">Scripture Map</button><button data-tab="research">Research Dashboard</button><button data-tab="arguments">Argument Explorer</button></div></header><main><div class="toolbar"><input id="q" placeholder="Search reference, topic, or evidence"><select id="filter"><option value="">All themes</option></select><select id="relation"><option value="">All connection types</option></select><button id="reset">Reset</button></div><div id="network" class="layout"><section class="panel"><p class="muted">Tap nodes to explore. Drag background to pan; scroll to zoom.</p><svg id="map" viewBox="0 0 800 460"></svg></section><section class="panel" id="detail"></section></div><div id="research" class="layout hidden"><section class="panel" id="results"></section><section class="panel" id="researchDetail"></section></div><div id="arguments" class="layout hidden"><section class="panel" id="argumentList"></section><section class="panel" id="argumentDetail"></section></div><p id="status" class="muted"></p><p class="muted">Research sample. Direct quotations, shared titles and interpretive parallels are distinct categories. Not all connections prove the doctrine independently.</p></main><script>
const verses=[{"id":0,"ref":"Genesis 1:2","note":"Spirit at creation","theme":"Spirit"},{"id":1,"ref":"Genesis 1:26","note":"Let us make","theme":"Distinction"},{"id":2,"ref":"Genesis 19:24","note":"YHWH from YHWH","theme":"Distinction"},{"id":3,"ref":"Exodus 3:2-6","note":"Angel of YHWH","theme":"Distinction"},{"id":4,"ref":"Deuteronomy 6:4","note":"YHWH is one","theme":"Monotheism"},{"id":5,"ref":"Psalm 45:6-7","note":"God addressed and anointed","theme":"Son"},{"id":6,"ref":"Psalm 95:7-11","note":"YHWH speaks","theme":"Spirit"},{"id":7,"ref":"Psalm 102:25-27","note":"Eternal Creator","theme":"Son"},{"id":8,"ref":"Psalm 110:1","note":"YHWH and my Lord","theme":"Distinction"},{"id":9,"ref":"Isaiah 6:1-10","note":"YHWH's glory","theme":"Son"},{"id":10,"ref":"Isaiah 44:6","note":"First and Last","theme":"Son"},{"id":11,"ref":"Isaiah 45:23","note":"Every knee bows","theme":"Son"},{"id":12,"ref":"Joel 2:32","note":"Call on YHWH","theme":"Son"},{"id":13,"ref":"Daniel 7:13-14","note":"Son of Man and Ancient of Days","theme":"Distinction"},{"id":14,"ref":"Matthew 3:16-17","note":"Father Son and Spirit at baptism","theme":"Triadic"},{"id":15,"ref":"Matthew 28:19","note":"One name, three persons","theme":"Triadic"},{"id":16,"ref":"John 1:1-3","note":"The Word was God","theme":"Son"},{"id":17,"ref":"John 12:37-41","note":"Isaiah saw his glory","theme":"Son"},{"id":18,"ref":"John 17:5","note":"Preexistent glory with Father","theme":"Distinction"},{"id":19,"ref":"Acts 5:3-4","note":"Lie to Spirit, lie to God","theme":"Spirit"},{"id":20,"ref":"Acts 13:2","note":"Spirit speaks personally","theme":"Spirit"},{"id":21,"ref":"Romans 10:9-13","note":"Joel applied to Jesus","theme":"Son"},{"id":22,"ref":"2 Corinthians 13:14","note":"Threefold blessing","theme":"Triadic"},{"id":23,"ref":"Philippians 2:9-11","note":"Every knee bows to Jesus","theme":"Son"},{"id":24,"ref":"Hebrews 1:8-12","note":"Son addressed as God and Creator","theme":"Son"},{"id":25,"ref":"Hebrews 3:7-11","note":"Spirit speaks Psalm 95","theme":"Spirit"},{"id":26,"ref":"Revelation 1:17-18","note":"Jesus First and Last","theme":"Son"},{"id":27,"ref":"Revelation 5:11-14","note":"Lamb receives heavenly honor","theme":"Son"}],edges=[{"id":0,"a":7,"b":24,"type":"Direct quotation"},{"id":1,"a":6,"b":25,"type":"Direct quotation"},{"id":2,"a":11,"b":23,"type":"Direct quotation"},{"id":3,"a":12,"b":21,"type":"Direct quotation"},{"id":4,"a":10,"b":26,"type":"Shared divine title"},{"id":5,"a":9,"b":17,"type":"Explicit NT application"},{"id":6,"a":5,"b":24,"type":"Direct quotation"},{"id":7,"a":8,"b":18,"type":"Thematic parallel"},{"id":8,"a":0,"b":14,"type":"Thematic parallel"},{"id":9,"a":1,"b":16,"type":"Interpretive parallel"},{"id":10,"a":2,"b":3,"type":"Interpretive parallel"},{"id":11,"a":14,"b":15,"type":"Triadic parallel"},{"id":12,"a":16,"b":24,"type":"Thematic parallel"},{"id":13,"a":19,"b":20,"type":"Thematic parallel"},{"id":14,"a":4,"b":21,"type":"Thematic parallel"},{"id":15,"a":13,"b":18,"type":"Interpretive parallel"},{"id":16,"a":10,"b":27,"type":"Thematic parallel"}];
const $=id=>document.getElementById(id);let chosen=10,query="",theme="",relation="",zoom=1,px=0,py=0,drag=null;
[...new Set(verses.map(v=>v.theme))].sort().forEach(t=>$("filter").add(new Option(t,t)));[...new Set(edges.map(x=>x.type))].sort().forEach(t=>$("relation").add(new Option(t,t)));
function matching(){return verses.filter(v=>(!theme||v.theme===theme)&&(!query||(v.ref+" "+v.note+" "+v.theme).toLowerCase().includes(query)));}
function panel(id){let v=verses[chosen],connected=edges.filter(e=>e.a===chosen||e.b===chosen);$(id).innerHTML="<h2>"+v.ref+"</h2><p>"+v.note+"</p><p class='muted'>"+v.theme+"</p><h3>Related passages</h3>"+connected.map(e=>"<button data-verse='"+(e.a===chosen?e.b:e.a)+"'>"+verses[e.a===chosen?e.b:e.a].ref+" — "+e.type+"</button>").join("")+"<p><a target='_blank' rel='noopener' href='https://www.biblegateway.com/passage/?search="+encodeURIComponent(v.ref)+"'>Read biblical text</a></p>";}
function render(){let vs=matching(),ids=new Set(vs.map(v=>v.id)),es=edges.filter(e=>ids.has(e.a)&&ids.has(e.b)&&(!relation||e.type===relation));$("results").innerHTML="<h2>Scripture index ("+vs.length+")</h2>"+vs.map(v=>"<div class='entry' data-verse='"+v.id+"'><b>"+v.ref+"</b><p>"+v.note+" · "+v.theme+"</p></div>").join("");panel("detail");panel("researchDetail");let pos=new Map();vs.forEach((v,i)=>{let a=2*Math.PI*i/Math.max(1,vs.length),r=vs.length===1?0:Math.min(175,75+vs.length*5);pos.set(v.id,[400+Math.cos(a)*r,230+Math.sin(a)*r]);});let s="<g transform='translate("+px+" "+py+") scale("+zoom+")'>";es.forEach(e=>{let a=pos.get(e.a),b=pos.get(e.b);s+="<line x1='"+a[0]+"' y1='"+a[1]+"' x2='"+b[0]+"' y2='"+b[1]+"' stroke='"+(e.type==="Direct quotation"?"#63cfa9":e.type==="Interpretive parallel"?"#d7a469":"#79a9e5")+"' stroke-width='2'><title>"+e.type+"</title></line>";});vs.forEach(v=>{let p=pos.get(v.id);s+="<g data-verse='"+v.id+"' style='cursor:pointer'><circle cx='"+p[0]+"' cy='"+p[1]+"' r='"+(chosen===v.id?13:9)+"' fill='"+(chosen===v.id?"#ffd16c":"#66a8e4")+"' stroke='white'/><text x='"+(p[0]+12)+"' y='"+(p[1]-11)+"' font-size='11' fill='white' pointer-events='none'>"+v.ref+"</text></g>";});$("map").innerHTML=s+"</g>";$("status").textContent=verses.length+" passages · "+edges.length+" cross-references · "+vs.length+" results";}
const claims=[["Monotheism","Monotheism","Scripture maintains that there is one God."],["Deity of the Son","Son","The Son is described with divine identity and Creator language."],["Personhood and deity of the Spirit","Spirit","The Spirit speaks and is identified with God."],["Personal distinction","Distinction","Father and Son are personally distinguished."],["Threefold formulas","Triadic","Father, Son and Spirit appear together."]];
$("argumentList").innerHTML="<h2>Argument paths</h2>"+claims.map((c,i)=>"<button data-claim='"+i+"'>"+c[0]+"</button>").join("");
function claim(i){let c=claims[i];$("argumentDetail").innerHTML="<h2>"+c[0]+"</h2><p>"+c[2]+"</p>"+verses.filter(v=>v.theme===c[1]).map(v=>"<button data-verse='"+v.id+"'>"+v.ref+"</button>").join("");}
document.addEventListener("click",ev=>{let b=ev.target.closest("[data-verse],[data-tab],[data-claim]");if(!b)return;if(b.dataset.verse!==undefined){chosen=Number(b.dataset.verse);render()}else if(b.dataset.claim!==undefined){claim(Number(b.dataset.claim))}else{["network","research","arguments"].forEach(t=>$(t).classList.toggle("hidden",t!==b.dataset.tab));document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));}});
$("q").oninput=ev=>{query=ev.target.value.toLowerCase();render()};$("filter").onchange=ev=>{theme=ev.target.value;render()};$("relation").onchange=ev=>{relation=ev.target.value;render()};$("reset").onclick=()=>{$("q").value=$("filter").value=$("relation").value="";query=theme=relation="";zoom=1;px=py=0;render()};
$("map").addEventListener("wheel",ev=>{ev.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*(ev.deltaY>0?.9:1.1)));render()},{passive:false});
$("map").addEventListener("pointerdown",ev=>{if(ev.target.closest("[data-verse]"))return;drag=[ev.clientX,ev.clientY];$("map").setPointerCapture(ev.pointerId)});$("map").addEventListener("pointermove",ev=>{if(!drag)return;let r=$("map").getBoundingClientRect();px+=(ev.clientX-drag[0])*800/r.width;py+=(ev.clientY-drag[1])*460/r.height;drag=[ev.clientX,ev.clientY];render()});$("map").addEventListener("pointerup",()=>drag=null);$("map").addEventListener("pointercancel",()=>drag=null);
claim(1);render();
</script></body></html>
